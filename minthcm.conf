<VirtualHost *:80>
    ServerAdmin webmaster@meharadvisory.com
    DocumentRoot /var/www/html/MintHCM
    ServerName meharadvisory.com
    ServerAlias www.meharadvisory.com

    <Directory /var/www/html/MintHCM>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog \${APACHE_LOG_DIR}/minthcm_error.log
    CustomLog \${APACHE_LOG_DIR}/minthcm_access.log combined

    # Increase limits for MintHCM/SuiteCRM
    <IfModule mod_php7.c>
        php_value memory_limit 512M
        php_value upload_max_filesize 100M
        php_value post_max_size 100M
        php_value max_execution_time 300
    </IfModule>
    <IfModule mod_php.c>
        php_value memory_limit 512M
        php_value upload_max_filesize 100M
        php_value post_max_size 100M
        php_value max_execution_time 300
    </IfModule>
</VirtualHost>
